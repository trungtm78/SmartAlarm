<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img"><title>Keep the existing BMS. Connect evidence to rescue action.</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#137d75"/></marker></defs><rect width="1280" height="660" fill="#f1f5f4"/><text x="50" y="65" font-family="Segoe UI,Arial" font-size="27" font-weight="700" fill="#152e3b">Keep the existing BMS. Connect evidence to rescue action.</text><rect x="45" y="145" width="270" height="185" rx="12" fill="white" stroke="#a9c3c4" stroke-width="2"/><rect x="45" y="145" width="270" height="8" fill="#b41d35"/><circle cx="87" cy="195" r="20" fill="#e7f0ee"/><text x="78" y="202" font-family="Arial" font-size="20" fill="#137d75">1</text><text x="65" y="245" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#152e3b">Existing BMS</text><text x="65" y="285" font-family="Segoe UI,Arial" font-size="14" fill="#526a75">BACnet · EWS · REST · OPC</text><path d="M318 220H350" stroke="#137d75" stroke-width="4" marker-end="url(#arrow)"/><rect x="355" y="145" width="270" height="185" rx="12" fill="white" stroke="#a9c3c4" stroke-width="2"/><rect x="355" y="145" width="270" height="8" fill="#137d75"/><circle cx="397" cy="195" r="20" fill="#e7f0ee"/><text x="388" y="202" font-family="Arial" font-size="20" fill="#137d75">2</text><text x="375" y="245" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#152e3b">Site integration edge</text><text x="375" y="285" font-family="Segoe UI,Arial" font-size="14" fill="#526a75">Adapters · mapping · journal</text><path d="M628 220H660" stroke="#137d75" stroke-width="4" marker-end="url(#arrow)"/><rect x="665" y="145" width="270" height="185" rx="12" fill="white" stroke="#a9c3c4" stroke-width="2"/><rect x="665" y="145" width="270" height="8" fill="#155fa0"/><circle cx="707" cy="195" r="20" fill="#e7f0ee"/><text x="698" y="202" font-family="Arial" font-size="20" fill="#137d75">3</text><text x="685" y="245" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#152e3b">SmartAlarm regional</text><text x="685" y="285" font-family="Segoe UI,Arial" font-size="14" fill="#526a75">Alarm · incident · evidence</text><path d="M938 220H970" stroke="#137d75" stroke-width="4" marker-end="url(#arrow)"/><rect x="975" y="145" width="270" height="185" rx="12" fill="white" stroke="#a9c3c4" stroke-width="2"/><rect x="975" y="145" width="270" height="8" fill="#137d75"/><circle cx="1017" cy="195" r="20" fill="#e7f0ee"/><text x="1008" y="202" font-family="Arial" font-size="20" fill="#137d75">4</text><text x="995" y="245" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#152e3b">Coordinated rescue</text><text x="995" y="285" font-family="Segoe UI,Arial" font-size="14" fill="#526a75">App · PA · team · care</text><path d="M1130 350V405H175V350" fill="none" stroke="#b41d35" stroke-width="3" stroke-dasharray="9 7"/><text x="310" y="395" font-family="Segoe UI,Arial" font-size="18" font-weight="600" fill="#a0182e">Return requests require capability + approval + local authority</text><rect x="50" y="455" width="380" height="70" rx="8" fill="#e3ece9"/><text x="70" y="497" font-family="Segoe UI,Arial" font-size="19" fill="#173d3b">Observation ≠ control</text><rect x="455" y="455" width="380" height="70" rx="8" fill="#e3ece9"/><text x="475" y="497" font-family="Segoe UI,Arial" font-size="19" fill="#173d3b">ACK ≠ hazard cleared</text><rect x="860" y="455" width="380" height="70" rx="8" fill="#e3ece9"/><text x="880" y="497" font-family="Segoe UI,Arial" font-size="19" fill="#173d3b">Accepted ≠ physical effect</text><text x="50" y="585" font-family="Segoe UI,Arial" font-size="17" fill="#526a75">Local protection and overrides continue independently of SmartAlarm.</text><text x="50" y="620" font-family="Segoe UI,Arial" font-size="14" fill="#526a75">Proposed architecture · not an accepted live integration</text></svg>