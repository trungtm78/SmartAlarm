<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#006d65"/></marker></defs><rect width="1600" height="1000" fill="#f2f4f6"/><text x="60" y="55" fill="#006d65" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">SMARTALARM / SOLUTION DESIGN</text><text x="60" y="107" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="650" text-anchor="start">Kết nối nhanh nhờ hợp đồng, không nhờ tích hợp chắp vá</text><text x="60" y="145" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Một connector khai báo khả năng, được kiểm thử và chỉ hoạt động trong phạm vi được cấp</text><rect x="60" y="200" width="280" height="255" rx="18" fill="white" stroke="#d8e0e5"/><circle cx="90" cy="233" r="16" fill="#bf2335" stroke="none" stroke-width="1"/><text x="90" y="239" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="117" y="240" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start">Khai báo</text><text x="84" y="280" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Protocol • auth •</text><text x="84" y="308" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">schema • capability •</text><text x="84" y="336" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">retry class</text><rect x="360" y="200" width="280" height="255" rx="18" fill="white" stroke="#d8e0e5"/><circle cx="390" cy="233" r="16" fill="#bf2335" stroke="none" stroke-width="1"/><text x="390" y="239" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="417" y="240" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start">Ánh xạ</text><text x="384" y="280" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Source → canonical</text><text x="384" y="308" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">event; unit, location</text><text x="384" y="336" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">và provenance</text><rect x="660" y="200" width="280" height="255" rx="18" fill="white" stroke="#d8e0e5"/><circle cx="690" cy="233" r="16" fill="#bf2335" stroke="none" stroke-width="1"/><text x="690" y="239" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="717" y="240" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start">Kiểm thử</text><text x="684" y="280" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Duplicate • stale •</text><text x="684" y="308" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">revoked • cross-tenant</text><text x="684" y="336" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">• reconnect</text><rect x="960" y="200" width="280" height="255" rx="18" fill="white" stroke="#d8e0e5"/><circle cx="990" cy="233" r="16" fill="#bf2335" stroke="none" stroke-width="1"/><text x="990" y="239" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text><text x="1017" y="240" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start">Phê duyệt</text><text x="984" y="280" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Version cụ thể • quyền</text><text x="984" y="308" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">tối thiểu • môi trường</text><text x="984" y="336" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">tách biệt</text><rect x="1260" y="200" width="280" height="255" rx="18" fill="white" stroke="#d8e0e5"/><circle cx="1290" cy="233" r="16" fill="#bf2335" stroke="none" stroke-width="1"/><text x="1290" y="239" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">5</text><text x="1317" y="240" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start">Vận hành</text><text x="1284" y="280" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Health • lag • DLQ •</text><text x="1284" y="308" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">rotation • deprecation</text><path d="M340 325H360" fill="none" stroke="#006d65" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 325H660" fill="none" stroke="#006d65" stroke-width="3" marker-end="url(#arrow)"/><path d="M940 325H960" fill="none" stroke="#006d65" stroke-width="3" marker-end="url(#arrow)"/><path d="M1240 325H1260" fill="none" stroke="#006d65" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="505" width="1480" height="240" rx="18" fill="#101e28" stroke="#101e28"/><text x="90" y="555" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">CÙNG NỀN TẢNG, NHIỀU HỆ SINH THÁI</text><text x="90" y="615" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">IoT / Camera</text><text x="90" y="653" fill="#c6d5de" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">MQTT • HTTPS • video gateway</text><text x="450" y="615" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">Thiên tai / IOC</text><text x="450" y="653" fill="#c6d5de" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">CAP • partner API • webhook</text><text x="810" y="615" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">Loa / Thiết bị</text><text x="810" y="653" fill="#c6d5de" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">PA • local controller •</text><text x="810" y="680" fill="#c6d5de" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">feedback</text><text x="1170" y="615" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">Drone / Xe</text><text x="1170" y="653" fill="#c6d5de" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Telemetry • mission • payload</text><rect x="60" y="795" width="1480" height="120" rx="18" fill="#e6f5f1" stroke="none"/><text x="90" y="839" fill="#006d65" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Telemetry.read ≠ command.execute</text><text x="90" y="878" fill="#006d65" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Không tự nâng quyền điều khiển • ACK không phải hoàn thành vật lý • Replay sự kiện không replay lệnh</text><text x="60" y="974" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Hình minh họa thiết kế • Dữ liệu giả định • Không phải sơ đồ hiện trường hoặc chứng nhận năng lực</text></svg>