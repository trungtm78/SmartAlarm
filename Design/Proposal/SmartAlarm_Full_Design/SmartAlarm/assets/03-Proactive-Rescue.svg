<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#006d65"/></marker></defs><rect width="1600" height="1000" fill="#f2f4f6"/><text x="60" y="55" fill="#006d65" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">SMARTALARM / SOLUTION DESIGN</text><text x="60" y="107" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="650" text-anchor="start">Một sự cố, hai đường tiếp cận cứu người</text><text x="60" y="145" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Chủ động tìm người cần hỗ trợ song song với tiếp nhận SOS — không chờ người gặp nạn tự bấm nút</text><rect x="60" y="205" width="450" height="170" rx="18" fill="white" stroke="#d8e0e5"/><circle cx="90" cy="238" r="16" fill="#bf2335" stroke="none" stroke-width="1"/><text x="90" y="244" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="117" y="245" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start">Phát hiện &amp; khoanh vùng</text><text x="84" y="285" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Camera + smoke sensor tạo bằng chứng.</text><text x="84" y="313" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Operator xác nhận vùng ảnh hưởng.</text><rect x="575" y="205" width="450" height="170" rx="18" fill="white" stroke="#d8e0e5"/><circle cx="605" cy="238" r="16" fill="#bf2335" stroke="none" stroke-width="1"/><text x="605" y="244" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="632" y="245" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start">Ai có thể đang gặp nguy?</text><text x="599" y="285" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Đối chiếu hiện diện, độ mới vị trí và</text><text x="599" y="313" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">nhu cầu hỗ trợ đã được khai báo.</text><rect x="1090" y="205" width="450" height="170" rx="18" fill="white" stroke="#d8e0e5"/><circle cx="1120" cy="238" r="16" fill="#bf2335" stroke="none" stroke-width="1"/><text x="1120" y="244" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="1147" y="245" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start">Ưu tiên có giải thích</text><text x="1114" y="285" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Mức phơi nhiễm, khả năng tự thoát, đường</text><text x="1114" y="313" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">đi và thông tin chưa rõ.</text><path d="M510 290H575" fill="none" stroke="#006d65" stroke-width="4" marker-end="url(#arrow)"/><path d="M1025 290H1090" fill="none" stroke="#006d65" stroke-width="4" marker-end="url(#arrow)"/><rect x="60" y="420" width="700" height="250" rx="18" fill="#fff0f1" stroke="none"/><text x="90" y="465" fill="#bf2335" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">NHÁNH A / CÓ SOS</text><text x="90" y="510" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Người bị mắc kẹt báo vị trí → máy chủ ghi nhận →</text><text x="90" y="545" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">operator tiếp nhận → đội được phân công.</text><text x="90" y="628" fill="#bf2335" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Receipt ≠ human ACK ≠ rescue completed</text><rect x="800" y="420" width="740" height="250" rx="18" fill="#fff5da" stroke="none"/><text x="830" y="465" fill="#875900" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">NHÁNH B / CHƯA CÓ SOS</text><text x="830" y="510" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Người cần hỗ trợ vận động trong vùng ảnh hưởng →</text><text x="830" y="545" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">proactive case → kiểm tra chủ động → điều phối.</text><text x="830" y="628" fill="#875900" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Vị trí cũ → chưa chắc hiện diện; không giả định đang ở đó</text><path d="M410 670V715H800V750" fill="none" stroke="#006d65" stroke-width="4" marker-end="url(#arrow)"/><path d="M1170 670V715H800" fill="none" stroke="#006d65" stroke-width="4"/><rect x="60" y="770" width="1480" height="145" rx="18" fill="#101e28" stroke="#101e28"/><text x="90" y="818" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">MỘT NHIỆM VỤ CHO MỘT NHU CẦU CỨU HỘ</text><text x="90" y="860" fill="#c4d4dd" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">SOS đến sau được liên kết vào hồ sơ chủ động. Đội ứng cứu ghi nhận kết quả, bàn giao và cập nhật người thân</text><text x="90" y="890" fill="#c4d4dd" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">theo quyền chia sẻ.</text><text x="60" y="974" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Hình minh họa thiết kế • Dữ liệu giả định • Không phải sơ đồ hiện trường hoặc chứng nhận năng lực</text></svg>