<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#006d65"/></marker></defs><rect width="1600" height="1000" fill="#f2f4f6"/><text x="60" y="55" fill="#006d65" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">SMARTALARM / SOLUTION DESIGN</text><text x="60" y="107" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="650" text-anchor="start">Định vị → tính tuyến → voice &amp; loa → cập nhật</text><text x="60" y="145" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Bộ định tuyến kiểm tra ràng buộc; AI giải thích và hỗ trợ quyết định, không tự tạo đường thoát hiểm</text><rect x="60" y="200" width="340" height="225" rx="18" fill="white" stroke="#d8e0e5"/><circle cx="90" cy="233" r="16" fill="#bf2335" stroke="none" stroke-width="1"/><text x="90" y="239" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="117" y="240" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start">Định vị hợp nhất</text><text x="84" y="280" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">GNSS / QR / BLE / UWB /</text><text x="84" y="308" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">manual. Có tầng, sai số,</text><text x="84" y="336" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">nguồn và timestamp.</text><rect x="440" y="200" width="340" height="225" rx="18" fill="white" stroke="#d8e0e5"/><circle cx="470" cy="233" r="16" fill="#bf2335" stroke="none" stroke-width="1"/><text x="470" y="239" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="497" y="240" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start">Ảnh chụp tình huống</text><text x="464" y="280" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Graph có phiên bản + vùng</text><text x="464" y="308" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">nguy hiểm + accessibility +</text><text x="464" y="336" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">capacity.</text><rect x="820" y="200" width="340" height="225" rx="18" fill="white" stroke="#d8e0e5"/><circle cx="850" cy="233" r="16" fill="#bf2335" stroke="none" stroke-width="1"/><text x="850" y="239" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="877" y="240" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start">Loại tuyến không hợp lệ</text><text x="844" y="280" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Không qua vùng cấm, lối bị</text><text x="844" y="308" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">chặn hoặc đường không phù hợp</text><text x="844" y="336" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">khả năng di chuyển.</text><rect x="1200" y="200" width="340" height="225" rx="18" fill="white" stroke="#d8e0e5"/><circle cx="1230" cy="233" r="16" fill="#bf2335" stroke="none" stroke-width="1"/><text x="1230" y="239" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text><text x="1257" y="240" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start">So sánh phương án</text><text x="1224" y="280" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Thời gian + tắc nghẽn + mức</text><text x="1224" y="308" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">chưa chắc. Không mặc định</text><text x="1224" y="336" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">ngắn nhất là tốt nhất.</text><path d="M400 310H440" fill="none" stroke="#006d65" stroke-width="3" marker-end="url(#arrow)"/><path d="M780 310H820" fill="none" stroke="#006d65" stroke-width="3" marker-end="url(#arrow)"/><path d="M1160 310H1200" fill="none" stroke="#006d65" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="480" width="455" height="230" rx="18" fill="white" stroke="#d8e0e5"/><circle cx="90" cy="513" r="16" fill="#bf2335" stroke="none" stroke-width="1"/><text x="90" y="519" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">5</text><text x="117" y="520" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start">Hướng dẫn nhất quán</text><text x="84" y="560" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">App: từng chặng + voice + rung + text.</text><text x="84" y="588" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Loa: theo vùng và ngôn ngữ. Cùng</text><text x="84" y="616" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">guidance version.</text><rect x="555" y="480" width="455" height="230" rx="18" fill="white" stroke="#d8e0e5"/><circle cx="585" cy="513" r="16" fill="#bf2335" stroke="none" stroke-width="1"/><text x="585" y="519" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">6</text><text x="612" y="520" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start">Cập nhật theo diễn biến</text><text x="579" y="560" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Hazard mới → rút tuyến cũ → hủy âm thanh</text><text x="579" y="588" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">cũ → tính lại. Thiếu dữ liệu → nói rõ và</text><text x="579" y="616" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">hỗ trợ.</text><rect x="1050" y="480" width="490" height="230" rx="18" fill="white" stroke="#d8e0e5"/><circle cx="1080" cy="513" r="16" fill="#bf2335" stroke="none" stroke-width="1"/><text x="1080" y="519" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">AI</text><text x="1107" y="520" fill="#142029" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start">Trợ lý có dẫn nguồn</text><text x="1074" y="560" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Tóm tắt, đối chiếu SOP, nêu mâu thuẫn và</text><text x="1074" y="588" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">giải thích lựa chọn. Không quyền actuation.</text><path d="M515 590H555" fill="none" stroke="#006d65" stroke-width="3" marker-end="url(#arrow)"/><path d="M1010 590H1050" fill="none" stroke="#006d65" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="765" width="1480" height="150" rx="18" fill="#101e28" stroke="#101e28"/><text x="90" y="811" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">BA NGUYÊN TẮC HIỂN THỊ</text><text x="90" y="847" fill="#d1e1e9" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">1. Không rõ hướng → chỉ dẫn theo mốc.</text><text x="90" y="876" fill="#d1e1e9" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">2. Không có tuyến phù hợp → yêu cầu hỗ trợ.</text><text x="90" y="905" fill="#d1e1e9" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">3. Đến điểm tập kết ≠ tự động xác nhận người đó an toàn.</text><text x="60" y="974" fill="#52626f" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Hình minh họa thiết kế • Dữ liệu giả định • Không phải sơ đồ hiện trường hoặc chứng nhận năng lực</text></svg>